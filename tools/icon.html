<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head>
<body>
<!-- App icon: a cross-section of the Earth's layers with a shaft dug down to a glowing core. -->
<svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9fe0"/><stop offset="1" stop-color="#bfe0f4"/></linearGradient>
    <radialGradient id="core" cx="512" cy="1080" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff2b0"/><stop offset=".35" stop-color="#ffb23a"/><stop offset=".7" stop-color="#e2531c"/><stop offset="1" stop-color="#7a1e0a"/></radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a12"/><stop offset=".75" stop-color="#1a100b"/><stop offset="1" stop-color="#ff8a2a"/></linearGradient>
    <clipPath id="ground"><rect x="0" y="300" width="1024" height="724"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="190" cy="140" r="62" fill="#fff6dc" opacity=".9"/>
  <!-- trowel stuck in the ground next to the hole -->
  <g transform="translate(700 232) rotate(200)">
    <path d="M0 -10 L-40 -150 Q0 -230 40 -150 Z" fill="#cfd3d8"/>
    <path d="M0 -10 L-40 -150 Q0 -230 0 -230 Z" fill="#e8ebee"/>
    <rect x="-9" y="-10" width="18" height="40" rx="4" fill="#9aa0a6"/>
    <rect x="-17" y="28" width="34" height="120" rx="17" fill="#ef7f2c"/>
    <rect x="-17" y="28" width="12" height="120" rx="6" fill="#f59a52"/>
  </g>
  <g clip-path="url(#ground)">
    <path d="M0 300 Q256 285 512 300 T1024 300 V1024 H0Z" fill="#9e6038"/>
    <path d="M0 430 Q300 415 600 432 T1024 425 V1024 H0Z" fill="#c4683a"/>
    <path d="M0 540 Q280 555 560 538 T1024 548 V1024 H0Z" fill="#7d7c7a"/>
    <path d="M0 640 Q300 628 640 645 T1024 636 V1024 H0Z" fill="#d9cdb2"/>
    <path d="M0 720 Q320 735 620 718 T1024 728 V1024 H0Z" fill="#3b3550"/>
    <path d="M0 800 Q300 788 600 806 T1024 796 V1024 H0Z" fill="#2a1d18"/>
    <circle cx="512" cy="1080" r="330" fill="url(#core)"/>
    <!-- soft shading on each band -->
    <rect x="0" y="300" width="1024" height="724" fill="#000" opacity=".06"/>
    <!-- the shaft -->
    <path d="M462 300 C455 420 470 520 458 620 C450 700 470 760 486 820 L538 820 C552 760 572 700 564 620 C552 520 570 420 562 300 Z" fill="url(#shaft)"/>
    <ellipse cx="512" cy="822" rx="34" ry="12" fill="#ffcf6a" opacity=".9"/>
  </g>
  <!-- grass lip -->
  <path d="M0 296 Q120 276 240 292 T480 290 L462 304 L0 312Z" fill="#6aa236"/>
  <path d="M562 304 L544 290 Q700 274 840 292 T1024 290 V312 Z" fill="#6aa236"/>
  <path d="M0 290 l10-26 8 24 10-30 8 28 12-22 6 26 14-30 8 30 12-24 6 26 12-20 4 22h10l8-28 8 28 12-24 6 22 12-30 8 30 10-22 6 24 14-28 8 28 12-24 8 26 10-20 6 22 14-26 6 24 12-30 8 30 10-22 8 24 12-28 6 22 14-26 4 22 V300 H0Z" fill="#7fb83e"/>
  <path d="M560 290 l10-26 8 24 10-30 8 28 12-22 6 26 14-30 8 30 12-24 6 26 12-20 4 22h10l8-28 8 28 12-24 6 22 12-30 8 30 10-22 6 24 14-28 8 28 12-24 8 26 10-20 6 22 14-26 6 24 12-30 8 30 10-22 8 24 12-28 6 22 14-26 4 22 l20-20 10 24 V300 H560Z" fill="#7fb83e"/>
</svg>
</body></html>
